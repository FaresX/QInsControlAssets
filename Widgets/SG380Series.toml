# SG380Series 控制面板 —— 含全部已注册变量
# 布局：三组（RF / LF / HF），每组 = 组框 + 使能开关 + 幅度/频率目标 + 读数 + 扫描控制
[SG380]
instrnm = "SG380Series"
name = "SG380 控制面板"
windowsize = [560.0, 460.0]

# ============ 组框 1：RF ============
[[SG380.qtws]]
name = "_Panel_"
alias = "RF 输出"
qtype = "none"
    [SG380.qtws.options]
    uitype = "none"
    fontsize = 12.0
    vertices = [[15.0, 15.0], [0.0, 0.0], [0.0, 0.0]]
    itemsize = [530.0, 155.0]
    allowoverlap = true

# ---------- enablerf [set] ----------
[[SG380.qtws]]
name = "enablerf"
alias = "RF 输出使能"
qtype = "set"
numoptvs = 2
numread = 1
    [SG380.qtws.options]
    uitype = "toggle"
    vertices = [[40.0, 50.0], [0.0, 0.0], [0.0, 0.0]]
    itemsize = [140.0, 30.0]
    allowoverlap = true

# ---------- frequency [sweep] ----------
[[SG380.qtws]]
name = "frequency"
alias = "RF 频率目标"
qtype = "sweep"
numoptvs = 0
numread = 1
    [SG380.qtws.options]
    uitype = "inputstop"
    vertices = [[195.0, 50.0], [0.0, 0.0], [0.0, 0.0]]
    itemsize = [160.0, 30.0]
    allowoverlap = true

[[SG380.qtws]]
name = "frequency"
alias = "RF 频率读数"
qtype = "sweep"
numoptvs = 0
numread = 1
    [SG380.qtws.options]
    uitype = "readunit"
    vertices = [[370.0, 50.0], [0.0, 0.0], [0.0, 0.0]]
    itemsize = [160.0, 30.0]
    allowoverlap = true

[[SG380.qtws]]
name = "frequency"
alias = "RF 频率扫描"
qtype = "sweep"
numoptvs = 0
numread = 1
    [SG380.qtws.options]
    uitype = "ctrlsweep"
    vertices = [[40.0, 90.0], [0.0, 0.0], [0.0, 0.0]]
    itemsize = [140.0, 30.0]
    allowoverlap = true

